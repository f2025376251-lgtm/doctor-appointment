[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.processing.html]
  pretty_urls = true

[functions]
  node_bundler = "nft"
  included_files = [
    "server.js",
    "config.js",
    "notify.js",
    "supabase.js",
    "persist.js",
    "node_modules/@netlify/blobs/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/dashboard/"
  to = "/dashboard.html"
  status = 200

