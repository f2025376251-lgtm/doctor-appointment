[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "nft"
  included_files = [
    "server.js",
    "config.js",
    "notify.js",
    "supabase.js",
    "persist.js",
    "node_modules/@netlify/blobs/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true
